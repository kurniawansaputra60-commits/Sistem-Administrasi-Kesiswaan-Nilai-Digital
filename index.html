<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Administrasi Kesiswaan &amp; Nilai Digital</title>
    <meta name="description" content="Aplikasi digital administrasi kesiswaan sekolah lengkap sesuai format resmi Depdiknas/Kemdikbud (Format S-1 hingga S-20 &amp; Format PS) untuk mengelola data siswa, absensi, mutasi, kenaikan kelas, dan nilai." />
    <meta property="og:title" content="Sistem Administrasi Kesiswaan &amp; Nilai Digital" />
    <meta property="og:description" content="Aplikasi digital administrasi kesiswaan sekolah lengkap sesuai format resmi Depdiknas/Kemdikbud (Format S-1 hingga S-20 &amp; Format PS) untuk mengelola data siswa, absensi, mutasi, kenaikan kelas, dan nilai." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
            ws.addEventListener('error', function(e) {
              if (e && e.stopImmediatePropagation) {
                e.stopImmediatePropagation();
              }
            }, true);
            return ws;
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        function isIgnoredMessage(args) {
          try {
            var fullMsg = Array.prototype.slice.call(args).map(function(a) {
              if (a === null || a === undefined) return '';
              if (typeof a === 'object') {
                try { return JSON.stringify(a); } catch(e) { return String(a); }
              }
              return String(a);
            }).join(' ').toLowerCase();

            return fullMsg.indexOf('websocket') !== -1 ||
                   fullMsg.indexOf('vite') !== -1 && fullMsg.indexOf('connect') !== -1 ||
                   fullMsg.indexOf('vite') !== -1 && fullMsg.indexOf('terhubung') !== -1 ||
                   fullMsg.indexOf('gagal terhubung') !== -1 ||
                   fullMsg.indexOf('ditutup tanpa dibuka') !== -1 ||
                   fullMsg.indexOf('@vite/client') !== -1 ||
                   fullMsg.indexOf('failed to connect') !== -1;
          } catch(err) {
            return false;
          }
        }

        var origError = console.error;
        var origWarn = console.warn;
        var origInfo = console.info;
        var origLog = console.log;

        console.error = function() {
          if (isIgnoredMessage(arguments)) return;
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isIgnoredMessage(arguments)) return;
          origWarn.apply(console, arguments);
        };
        console.info = function() {
          if (isIgnoredMessage(arguments)) return;
          origInfo.apply(console, arguments);
        };
        console.log = function() {
          if (isIgnoredMessage(arguments)) return;
          origLog.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonMsg = String(event.reason.message || event.reason || '').toLowerCase();
            if (reasonMsg.indexOf('websocket') !== -1 || reasonMsg.indexOf('terhubung') !== -1 || reasonMsg.indexOf('failed to connect') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (event && (event.message || event.filename)) {
            var errMsg = String(event.message || '').toLowerCase();
            if (errMsg.indexOf('websocket') !== -1 || errMsg.indexOf('terhubung') !== -1 || errMsg.indexOf('failed to connect') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
